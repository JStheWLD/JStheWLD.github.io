<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maybelle · in a corner of the Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Libre+Baskerville:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a corner of the Hall with one arcade-style cabinet in it, the Living Memory on its screen.
   It opens on the whole sky and settles on Harold Bradley; a visitor rolls the trackball to him and hears someone who knew him. */
:root{--cream:#ece6d8;--faint:#8d8778;--amber:#e0a54a;--cyan:#5fb7da;--mono:"JetBrains Mono",monospace;--serif:"Libre Baskerville",Georgia,serif;--display:"Bodoni Moda",Georgia,serif}
html,body{height:100%;margin:0;background:#050403;overflow:hidden;color:var(--cream);font-family:var(--serif)}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);overflow:hidden}
svg.room{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;opacity:0;transition:opacity .7s}
.ov.on{opacity:1}
.panel{background:rgba(22,20,28,.97);border:1px solid rgba(224,165,74,.75);border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:1.1vw;padding:1.4vw;box-sizing:border-box;transform:translateX(8%);transition:opacity .6s,transform .6s}
.panel.on{transform:none}
.panel .top{display:flex;gap:1vw;align-items:center}
.panel .av{flex:0 0 4.4vw;height:4.4vw;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--cyan)}
.panel .k{font-family:var(--mono);font-size:.92vw;letter-spacing:.1em;text-transform:uppercase;color:#d9d2c4;line-height:1.4}
.panel .k b{display:block;color:var(--amber);font-weight:600;font-size:1.12vw}
.panel .q{font-family:var(--display);font-style:italic;font-size:1.5vw;line-height:1.32;color:#fbf8f0}
.panel .q span{opacity:0;transition:opacity .2s}.panel .q span.in{opacity:1}
.panel .s{font-family:var(--mono);font-size:.75vw;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cap{left:0;right:0;bottom:4%;text-align:center}
.cap h1{font-family:var(--display);font-weight:500;font-style:italic;font-size:3.2vw;margin:0;color:#fbf8f0}
.cap p{font-family:var(--mono);font-size:.8vw;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);margin:.8% 0 0}
.shade{inset:0;background:linear-gradient(to top,rgba(5,4,3,.94),rgba(5,4,3,0) 40%);transition:opacity 1.2s}
.face{position:absolute;inset:0;width:100%;height:100%;display:block}
.face .mouth{transform-box:fill-box;transform-origin:center}.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.face .hg{transform-box:view-box;transform-origin:100px 150px}
.talk .face .mouth{animation:talk .55s infinite}.talk .face .hg{animation:bob 1.6s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{0%{transform:scaleY(1)}20%{transform:scaleY(3)}40%{transform:scaleY(1.5)}60%{transform:scaleY(3.4)}80%{transform:scaleY(1.2)}100%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}70%{transform:rotate(1.2deg)}}

</style></head><body>
<div class="stage" id="stage">
<svg class="room" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="A corner of the Hall with one arcade-style cabinet, a porch, running Maybelle">
  <defs id="defs">
    <linearGradient id="gWL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17130f"/><stop offset="1" stop-color="#2b2420"/></linearGradient>
    <linearGradient id="gWR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#17130f"/><stop offset="1" stop-color="#2b2420"/></linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3029"/><stop offset="1" stop-color="#120e09"/></linearGradient>
    <radialGradient id="gScreenGlow" cx=".5" cy=".4" r=".5"><stop offset="0" stop-color="#5fb7da" stop-opacity=".3"/><stop offset="1" stop-color="#5fb7da" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ece4d2" stop-opacity=".9"/><stop offset="1" stop-color="#ece4d2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f3c67a"/><stop offset=".6" stop-color="#c0812e"/><stop offset="1" stop-color="#6a3e10"/></radialGradient>
    <linearGradient id="gMarq" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8751f"/><stop offset=".5" stop-color="#e0a54a"/><stop offset="1" stop-color="#b8751f"/></linearGradient>
  </defs>
  <g id="cam">
  <g id="room">
    <polygon points="0,0 800,70 800,680 0,790" fill="url(#gWL)"/>
    <polygon points="800,70 1600,0 1600,790 800,680" fill="url(#gWR)"/>
    <polygon points="0,0 1600,0 800,70" fill="#0b0907"/>
    <polygon points="0,790 800,680 1600,790 1600,900 0,900" fill="url(#gFloor)"/>
    <line x1="800" y1="70" x2="800" y2="680" stroke="#100d0a" stroke-width="2"/>
  </g>
  <g id="kiosk"></g>
  <g id="people"></g>
  </g>
</svg>
<div id="camHtml" style="position:absolute;inset:0;transform-origin:0 0"><div class="ov panel" id="p1"><div class="top"><div class="av" id="av1"></div><div class="k"><b>Andy Reiss</b>a session guitarist he mentored</div></div><div class="q" id="q1"></div><div class="s">Recorded with Maybelle · verified</div></div></div>
<div class="ov shade" id="shade"></div>
<div class="ov cap" id="cap"><h1>Maybelle</h1><p>at the Country Music Hall of Fame and Museum</p></div>
</div>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
let sd=7; const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const words=(el,s)=>{ el.innerHTML=s.split(' ').map(w=>`<span>${w}</span>`).join(' '); return [...el.querySelectorAll('span')] };

/* the cabinet: a freestanding arcade-style unit, Golden Tee shape but with a big landscape screen.
   Marquee on top, the screen, a control deck with a trackball, the body below. Built in its own units, placed at ox,oy, scaled by sc.
   Screen is 880 x 500; the map inside is drawn at MS times the base size so it reads at that size. */
function buildKiosk(parent,ox,oy,sc){
  sc=sc||1;
  const W=880,H=500,CW=W+120,MS=1.45, HB=100+H+52, DK=HB+86, BOT=DK+300;
  const K={ox,oy,sc,sx:60,sy:118,W,H,CW,MS};
  K.g=(x,y)=>[ox+x*sc,oy+y*sc];
  const root=mk('g',{transform:`translate(${ox} ${oy}) scale(${sc})`},parent); K.root=root;
  mk('ellipse',{cx:CW/2,cy:H*.6,rx:CW*.85,ry:H*1.1,fill:'url(#gScreenGlow)'},root);
  mk('ellipse',{cx:CW/2,cy:BOT+4,rx:CW*.55,ry:24,fill:'#000',opacity:.45},root);
  /* body */
  const L=CW*.12, R=CW*.88;
  mk('path',{d:`M${L} ${DK} L${R} ${DK} L${R-10} ${BOT} L${L+10} ${BOT} Z`,fill:'#16131b'},root);
  mk('path',{d:`M${L} ${DK} L${L+40} ${DK} L${L+32} ${BOT} L${L+10} ${BOT} Z M${R} ${DK} L${R-40} ${DK} L${R-32} ${BOT} L${R-10} ${BOT} Z`,fill:'#1f1b25'},root);
  const art=mk('g',{opacity:.85},root), m=CW/2;
  [[-1,'#e0a54a',.55,0],[-1,'#40c4e8',.5,48],[1,'#e0a54a',.55,0],[1,'#40c4e8',.5,48]].forEach(([s,col,op,o])=>{
    const x0=m+s*(m-L-60-o), x1=m+s*(m-L-200-o); mk('path',{d:`M${x0} ${BOT-10} L${x1} ${DK+30} L${x1+s*-32} ${DK+30} L${x0+s*-32} ${BOT-10} Z`,fill:col,opacity:op},art); });
  mk('rect',{x:m-40,y:DK+80,width:80,height:90,rx:6,fill:'#0d0b10',stroke:'#3a3442','stroke-width':2},root);
  mk('rect',{x:m-8,y:DK+102,width:16,height:26,rx:3,fill:'#e0a54a',opacity:.6},root);
  mk('rect',{x:L+10,y:BOT-4,width:R-L-20,height:14,fill:'#0a090c'},root);
  /* screen housing */
  mk('path',{d:`M0 90 L${CW} 90 L${CW-20} ${HB} L20 ${HB} Z`,fill:'#131118'},root);
  mk('rect',{x:40,y:100,width:CW-80,height:H+36,rx:16,fill:'#08070a',stroke:'#2c2a33','stroke-width':3},root);
  /* control deck */
  mk('path',{d:`M14 ${HB} L${CW-14} ${HB} L${CW+24} ${DK} L-24 ${DK} Z`,fill:'#1d1a23',stroke:'#2e2a36','stroke-width':2},root);
  mk('path',{d:`M14 ${HB} L${CW-14} ${HB}`,stroke:'#e0a54a','stroke-width':3,opacity:.8},root);
  K.bx=CW*.4; K.by=HB+40;
  mk('ellipse',{cx:K.bx,cy:K.by+6,rx:44,ry:22,fill:'#0b0a0d'},root);
  K.ball=mk('circle',{cx:K.bx,cy:K.by,r:30,fill:'url(#gBall)'},root);
  K.shine=mk('ellipse',{cx:K.bx-10,cy:K.by-10,rx:10,ry:7,fill:'#fff',opacity:.55},root);
  K.b1=mk('circle',{cx:CW*.6,cy:K.by+2,r:16,fill:'#e0a54a'},root);
  K.b2=mk('circle',{cx:CW*.67,cy:K.by+2,r:16,fill:'#40c4e8',opacity:.8},root);
  /* marquee */
  mk('rect',{x:10,y:0,width:CW-20,height:92,rx:10,fill:'#120f0a',stroke:'#3a3020','stroke-width':2},root);
  mk('rect',{x:22,y:10,width:CW-44,height:72,rx:6,fill:'url(#gMarq)'},root);
  const m1=mk('text',{x:m,y:54,'text-anchor':'middle',fill:'#fbf8f0','font-family':'Bodoni Moda, Georgia, serif','font-style':'italic','font-size':44},root); m1.textContent='Maybelle';
  const m2=mk('text',{x:m,y:75,'text-anchor':'middle',fill:'#2a1a08','font-family':'JetBrains Mono, monospace','font-size':12,'letter-spacing':'5'},root); m2.textContent='THE LIVING MEMORY OF MUSIC · PLAY AND EXPLORE';
  /* the screen */
  const clip=mk('clipPath',{id:'scr'+ox},$('defs')); mk('rect',{x:K.sx,y:K.sy,width:W,height:H,rx:8},clip);
  const s=mk('g',{'clip-path':`url(#scr${ox})`},root);
  mk('rect',{x:K.sx,y:K.sy,width:W,height:H,fill:'#0f0e13'},s);
  K.screen=s;
  K.cx=K.sx+W*.3; K.cy=K.sy+H*.56;
  K.sky=mk('g',{},s); K.edges=mk('g',{},K.sky); K.hotG=mk('g',{},K.sky); K.nodesG=mk('g',{},K.sky); K.labG=mk('g',{},K.sky); K.fx=mk('g',{},s);
  K.stars=[];
  for(let i=0;i<300;i++){ const x=K.cx+(rnd()*2-1)*620, y=K.cy+(rnd()*2-1)*420; if(Math.hypot(x-K.cx,y-K.cy)<40) continue;
    K.stars.push({x,y,el:mk('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:(.9+rnd()*1.8).toFixed(2),fill:rnd()<.18?'#e0a54a':'#7fc6e2',opacity:0},K.nodesG)}); }
  K.starEdges=[];
  K.stars.forEach((n,i)=>{ if(i%2) return; let b=-1,bd=1e9; for(let j=0;j<K.stars.length;j++){ if(j===i) continue; const d=Math.hypot(K.stars[j].x-n.x,K.stars[j].y-n.y); if(d<bd){bd=d;b=j} } if(bd<90) K.starEdges.push(mk('line',{x1:n.x,y1:n.y,x2:K.stars[b].x,y2:K.stars[b].y,stroke:'#2f5d72','stroke-width':.8,opacity:0},K.edges)); });
  K.named=[['Andy Reiss',-100,-74],['Joe Glaser',104,-80],['Patsy Cline',-112,30],['Owen Bradley',112,40],['Chet Atkins',-58,104],['Bob Moore',64,108]].map(([l,dx,dy])=>{
    const x=K.cx+dx,y=K.cy+dy; const c=mk('circle',{cx:x,cy:y,r:4.5,fill:'#7fc6e2',opacity:0},K.nodesG);
    const tx=mk('text',{x,y:y-11,'text-anchor':'middle',fill:'#ece6d8','font-family':'JetBrains Mono, monospace','font-size':12,opacity:0},K.labG); tx.textContent=l;
    const ln=mk('line',{x1:K.cx,y1:K.cy,x2:K.cx,y2:K.cy,stroke:'#e0a54a','stroke-width':1.6,opacity:0},K.hotG);
    return {l,x,y,c,tx,ln}; });
  K.hGlow=mk('circle',{cx:K.cx,cy:K.cy,r:30,fill:'url(#gC)',opacity:0},K.nodesG);
  K.hDot=mk('circle',{cx:K.cx,cy:K.cy,r:8,fill:'#ece4d2',opacity:0},K.nodesG);
  K.hLab=mk('text',{x:K.cx,y:K.cy-20,'text-anchor':'middle',fill:'#fbf8f0','font-family':'Bodoni Moda, Georgia, serif','font-style':'italic','font-size':22,opacity:0},K.labG); K.hLab.textContent='Harold Bradley';
  mk('rect',{x:K.sx,y:K.sy,width:W,height:46,fill:'#0f0e13'},s);
  const hd=mk('text',{x:K.sx+22,y:K.sy+30,fill:'#40c4e8','font-family':'JetBrains Mono, monospace','font-size':15,'letter-spacing':'3'},s); hd.textContent='';
  K.hd=hd;
  K.ripple=mk('circle',{cx:K.cx,cy:K.cy,r:10,fill:'none',stroke:'#fff','stroke-width':2.5,opacity:0},K.fx);
  K.cursor=mk('circle',{cx:K.cx-200,cy:K.cy+140,r:12,fill:'none',stroke:'#fbf8f0','stroke-width':2.5,opacity:0},s);
  K.zoom=1;
  /* screen position of a point on the map */
  K.sk=(x,y)=>[K.cx+(x-K.cx)*K.zoom*MS, K.cy+(y-K.cy)*K.zoom*MS];
  K.setZoom=z=>{ K.zoom=z; K.sky.setAttribute('transform',`translate(${K.cx} ${K.cy}) scale(${(z*MS).toFixed(4)}) translate(${-K.cx} ${-K.cy})`); };
  K.settle=()=>{ K.stars.forEach(s=>s.el.setAttribute('opacity',.85)); K.starEdges.forEach(e=>e.setAttribute('opacity',.5)); K.hGlow.setAttribute('opacity',.6); K.hDot.setAttribute('opacity',1); K.hLab.setAttribute('opacity',1);
    K.named.forEach(n=>{ n.c.setAttribute('opacity',1); n.tx.setAttribute('opacity',1); n.ln.setAttribute('x2',n.x); n.ln.setAttribute('y2',n.y); n.ln.setAttribute('opacity',.8); }); K.setZoom(1); };
  K.clear=()=>{ K.stars.forEach(s=>s.el.setAttribute('opacity',0)); K.starEdges.forEach(e=>e.setAttribute('opacity',0)); [K.hGlow,K.hDot,K.hLab,K.ripple,K.cursor].forEach(e=>e.setAttribute('opacity',0));
    K.named.forEach(n=>{ n.c.setAttribute('opacity',0); n.tx.setAttribute('opacity',0); n.ln.setAttribute('opacity',0); n.ln.setAttribute('x2',K.cx); n.ln.setAttribute('y2',K.cy); delete n.t0; }); K.setZoom(1); };
  return K; }

/* a visitor: a simple silhouette */
function person(parent,col){ const g=mk('g',{opacity:0},parent);
  mk('path',{d:'M-22 0 C-24 -60 -18 -96 0 -98 C18 -96 24 -60 22 0 Z',fill:col},g); mk('circle',{cx:0,cy:-114,r:15,fill:col},g);
  const arm=mk('line',{x1:10,y1:-84,x2:16,y2:-40,stroke:col,'stroke-width':9,'stroke-linecap':'round'},g);
  mk('path',{d:'M-14 0 L-12 38 M14 0 L12 38',stroke:col,'stroke-width':11,'stroke-linecap':'round'},g); return {g,arm}; }
function place(p,x,y,s){ p.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s})`); }

/* the clock the player drives: VT is scene time, SPEEDX its speed, PAUSED holds it, reset() starts over */
let VT=0,SPEEDX=1,PAUSED=false,last=performance.now(),Q=[],MV=[],TW=[];
const at=(ms,f)=>Q.push({due:ms,f});
const walk=(p,t0,t1,x0,y0,x1,y1,s0,s1)=>MV.push({p,t0,t1,x0,y0,x1,y1,s0,s1});
const tween=(t0,t1,f)=>TW.push({t0,t1,f});
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function step(n,draw){ if(!PAUSED) VT+=(n-last)*SPEEDX; last=n;
  for(let g=0;g<300;g++){ let i=-1,b=Infinity; Q.forEach((q,j)=>{ if(q.due<b){b=q.due;i=j} }); if(i<0||b>VT) break; const q=Q.splice(i,1)[0]; try{q.f()}catch(e){console.log(e)} }
  MV.forEach(m=>{ if(VT<m.t0) return; const e=ease(Math.min(1,(VT-m.t0)/(m.t1-m.t0))); place(m.p,m.x0+(m.x1-m.x0)*e,m.y0+(m.y1-m.y0)*e,m.s0+(m.s1-m.s0)*e); });
  TW.forEach(w=>{ if(VT<w.t0) return; w.f(ease(Math.min(1,(VT-w.t0)/(w.t1-w.t0)))); });
  draw(VT/1000); requestAnimationFrame(t=>step(t,draw)); }

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }
const PPL={andy:{n:'Andy Reiss',skin:'#e6b794',hair:'#d8d3cb',brow:'#a29c92',st:'short',gl:1,shirt:'#1f2228',bg:['#6a4630','#2a1a12'],prop:'guitar',real:1},joe:{n:'Joe Glaser',skin:'#efc7a4',hair:'#9a9590',brow:'#6a645e',st:'messy',shirt:'#2b2e35',bg:['#24384f','#111a26'],prop:'frame',real:1}};
let fid=0;
function face(k){ const p=PPL[k], g='fg'+(fid++), H=p.hair, S=p.skin, o=[];
 if(p.mono) return `<svg class="face" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.bg[0]}"/><stop offset="1" stop-color="${p.bg[1]}"/></linearGradient></defs><rect width="200" height="200" fill="url(#${g})"/><circle cx="100" cy="100" r="56" fill="rgba(0,0,0,.25)" stroke="rgba(224,165,74,.55)" stroke-width="2"/><text x="100" y="118" text-anchor="middle" font-family="Bodoni Moda, Georgia, serif" font-size="52" fill="#fbf8f0">${p.mono}</text><ellipse class="mouth" cx="100" cy="150" rx="0" ry="0"/></svg>`;
 o.push(`<svg class="face" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.bg[0]}"/><stop offset="1" stop-color="${p.bg[1]}"/></linearGradient><radialGradient id="${g}l" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#ffd28c" stop-opacity=".3"/><stop offset="1" stop-color="#ffd28c" stop-opacity="0"/></radialGradient></defs><rect width="200" height="200" fill="url(#${g})"/>`);
 if(p.prop==='guitar') o.push(`<g opacity=".5" transform="rotate(-12 166 130)"><rect x="163" y="20" width="7" height="100" fill="#2e1c10"/><ellipse cx="166" cy="128" rx="17" ry="18" fill="#9a6230"/><ellipse cx="166" cy="160" rx="23" ry="25" fill="#9a6230"/><circle cx="166" cy="148" r="6" fill="#24150b"/></g>`);
 if(p.prop==='records'){ const cols=['#c1512a','#e0a54a','#40c4e8','#ece6d8','#5b4a86','#2e6a45']; let r='<g opacity=".5"><rect x="0" y="62" width="200" height="3" fill="#0a0806"/>'; for(let i=0;i<11;i++){ const h=20+(hash(k+i)%10); r+=`<rect x="${4+i*5}" y="${62-h}" width="4" height="${h}" fill="${cols[i%6]}"/><rect x="${143+i*5}" y="${62-h}" width="4" height="${h}" fill="${cols[(i+3)%6]}"/>` } o.push(r+'</g>') }
 if(p.prop==='frame') o.push(`<g opacity=".6"><rect x="16" y="24" width="40" height="48" fill="rgba(0,0,0,.25)" stroke="#c9a46a" stroke-width="3"/><circle cx="36" cy="48" r="12" fill="#151515"/><circle cx="36" cy="48" r="3.5" fill="#c9a46a"/></g>`);
 if(p.prop==='lamp') o.push(`<g opacity=".65"><circle cx="30" cy="36" r="44" fill="#ffd28c" opacity=".16"/><path d="M16 32h28l-7-18h-14Z" fill="#e8c88a"/><rect x="29" y="32" width="2" height="70" fill="#111"/></g>`);
 o.push(`<rect width="200" height="200" fill="url(#${g}l)"/><path d="M18 200C22 162 58 148 100 148S178 162 182 200Z" fill="${p.shirt}"/><path d="M88 116h24v34q-12 8-24 0Z" fill="${S}"/><path d="M88 130q12 8 24 0v6q-12 6-24 0Z" fill="rgba(0,0,0,.14)"/><g class="hg">`);
 if(p.st==='long') o.push(`<path d="M60 92C58 46 142 46 140 92L148 166Q100 180 52 166Z" fill="${H}"/>`);

$('av1').innerHTML=face('andy');
/* real words, from Andy Reiss in the Gearcheck conversation */
const W1=words($('q1'),'My friend and mentor Harold Bradley called me up one day and said, Andy, it’s your lucky day. I’ve got you a D’Angelico.');
const K=buildKiosk($('kiosk'),410,36,.78);
const CAM=(x,y)=>[x,y];
/* camera: Z is the zoom, CY the point it centers on; wide shot is Z=1, CY=450 */
let Z=1, CY=450;
function applyCam(){ $('cam').setAttribute('transform',`translate(800 450) scale(${Z.toFixed(4)}) translate(-800 ${(-CY).toFixed(1)})`);
  const f=$('stage').clientWidth/1600; $('camHtml').style.transform=`translate(${((800-800*Z)*f).toFixed(1)}px,${((450-Z*CY)*f).toFixed(1)}px) scale(${Z.toFixed(4)})`; }
/* the quote panel sits over the right side of the screen */
(()=>{ const [x0,y0]=CAM(...K.g(K.sx+K.W*.57,K.sy+64)), [x1,y1]=CAM(...K.g(K.sx+K.W-18,K.sy+K.H-18)); const p=$('p1').style;
  p.left=(x0/16)+'%'; p.top=(y0/9)+'%'; p.width=((x1-x0)/16)+'%'; p.height=((y1-y0)/9)+'%'; })();
const P=[person($('people'),'#0b0908'),person($('people'),'#0d0b09'),person($('people'),'#0e0c0a')];
P[0].arm.setAttribute('stroke-width',6);
const topLab=mk('text',{x:K.cx,y:K.sy+72,'text-anchor':'middle',fill:'#e0a54a','font-family':'Bodoni Moda, Georgia, serif','font-style':'italic','font-size':22,opacity:0},K.screen); topLab.textContent='↑ the Lomax River';
const thread=mk('path',{d:`M${K.cx} ${K.cy} C ${K.cx+40} ${K.cy-110}, ${K.cx-40} ${K.sy+150}, ${K.cx} ${K.sy+80}`,fill:'none',stroke:'#e0a54a','stroke-width':1.8,opacity:0},K.fx);
const TL=thread.getTotalLength(); thread.setAttribute('stroke-dasharray',TL); thread.setAttribute('stroke-dashoffset',TL);
let hot=0, roll=null;
const C0=[K.cx-200,K.cy+140];

function reset(){ Q=[];MV=[];TW=[];VT=0;hot=0;roll=null; delete K.ripple.dataset.t0; Z=1; CY=450;
  // the camera: a wide shot of the corner, then a push in until the screen fills the frame, then back out for the title
  tween(3000,6200,k=>{ Z=1+.9*k; CY=450-120*k; });
  tween(20800,22800,k=>{ Z=1.9-.9*k; CY=330+120*k; });
  ['p1','cap','shade'].forEach(i=>$(i).classList.remove('on')); $('av1').classList.remove('talk'); W1.forEach(s=>s.classList.remove('in'));
  K.clear(); K.setZoom(.3); K.hd.setAttribute('opacity',0); topLab.setAttribute('opacity',0); thread.setAttribute('opacity',0); thread.setAttribute('stroke-dashoffset',TL);
  K.cursor.setAttribute('cx',C0[0]); K.cursor.setAttribute('cy',C0[1]); K.b1.setAttribute('fill','#e0a54a');
  P.forEach(p=>{ p.g.setAttribute('opacity',0); p.arm.setAttribute('x2',16); p.arm.setAttribute('y2',-40); place(p,-200,900,1); });
  // 1. the cabinet wakes on the whole sky
  at(900,()=>K.hd.setAttribute('opacity',1));
  K.stars.forEach((s,i)=>at(1100+(i%60)*25,()=>s.el.setAttribute('opacity',.85)));
  K.starEdges.forEach((e,i)=>at(1600+(i%50)*25,()=>e.setAttribute('opacity',.5)));
  // 2. a visitor walks up to play; the sky settles on Harold Bradley
  at(1800,()=>P[0].g.setAttribute('opacity',1)); walk(P[0],1800,5600,-100,880,330,880,4,4);
  tween(3600,7200,k=>K.setZoom(.3+.7*k));
  at(5400,()=>{ K.hGlow.setAttribute('opacity',.6); K.hDot.setAttribute('opacity',1); });
  at(7000,()=>{ K.hLab.setAttribute('opacity',1); K.named.forEach((n,i)=>{ n.c.setAttribute('opacity',1); at(7000+i*120,()=>{ n.t0=VT; n.ln.setAttribute('opacity',.8); n.tx.setAttribute('opacity',1); }); }); hot=1; });
  // 3. the trackball rolls the cursor to Harold, and the button opens him up
  at(5900,()=>{ { const [bx,by]=K.g(K.bx,K.by); P[0].arm.setAttribute('x2',((bx-330)/4).toFixed(1)); P[0].arm.setAttribute('y2',((by-880)/4).toFixed(1)); } K.cursor.setAttribute('opacity',1); roll=VT; });
  tween(6200,8200,k=>{ K.cursor.setAttribute('cx',(C0[0]+(K.cx-C0[0])*k).toFixed(1)); K.cursor.setAttribute('cy',(C0[1]+(K.cy-C0[1])*k).toFixed(1)); });
  at(8200,()=>roll=null);
  at(8500,()=>{ K.b1.setAttribute('fill','#fff3d6'); K.ripple.dataset.t0=VT; });
  at(8800,()=>{ K.b1.setAttribute('fill','#e0a54a'); K.cursor.setAttribute('opacity',0); $('p1').classList.add('on'); $('av1').classList.add('talk'); });
  W1.forEach((s,i)=>at(9100+i*235,()=>s.classList.add('in')));
  at(9100+W1.length*235+200,()=>$('av1').classList.remove('talk'));
  // 4. people gather; the panel closes and Harold's line runs on up to Lomax
  at(14500,()=>P[1].g.setAttribute('opacity',1)); walk(P[1],14500,18200,1900,890,1320,890,3.9,3.9);
  at(16600,()=>$('p1').classList.remove('on'));
  at(18800,()=>P[2].g.setAttribute('opacity',1)); walk(P[2],18800,22200,-200,900,110,900,3.8,3.8);
  // 5. the title
  at(22800,()=>{ $('shade').classList.add('on'); $('cap').classList.add('on'); });
  at(27000,reset); }

step(performance.now(),T=>{
  applyCam();
  $('room').setAttribute('opacity',(.2+.8*Math.min(1,VT/1200)).toFixed(2));
  K.named.forEach(n=>{ if(n.t0==null) return; const k=Math.min(1,(VT-n.t0)/500); n.ln.setAttribute('x2',(K.cx+(n.x-K.cx)*k).toFixed(1)); n.ln.setAttribute('y2',(K.cy+(n.y-K.cy)*k).toFixed(1)); });
  if(K.ripple.dataset.t0){ const k=(VT-(+K.ripple.dataset.t0))/900; if(k>=0&&k<=1){ K.ripple.setAttribute('r',(14+k*70).toFixed(1)); K.ripple.setAttribute('opacity',(1-k).toFixed(2)); } else K.ripple.setAttribute('opacity',0); }
  K.hGlow.setAttribute('r',(28+(hot?8:0)+Math.sin(T*2)*3).toFixed(1));
  const a=roll!=null?(VT-roll)/140:0; K.shine.setAttribute('cx',(K.bx-10*Math.cos(a)).toFixed(1)); K.shine.setAttribute('cy',(K.by-10*Math.sin(a)*.6-2).toFixed(1));
});
reset();

/* scroll control: the page sets this demo to any moment (ms of its own time); going back starts it over */
window.__seek=function(t){ PAUSED=true; if(window.__sT===undefined||t<window.__sT){ reset(); PAUSED=true; } window.__sT=t;
  for(let g=0;g<20000;g++){ let i=-1,b=Infinity; for(let j=0;j<Q.length;j++) if(Q[j].due<b){b=Q[j].due;i=j} if(i<0||b>t) break; VT=b; const q=Q[i]; if(q.every) q.due+=q.every; else Q.splice(i,1); try{q.f()}catch(e){} }
  VT=t; };
