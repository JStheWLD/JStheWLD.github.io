<html lang="en">

<style>
/* Layout: the Living Memory fills the screen. Maybelle is a lit point inside it; each signal lights its place on the map, she reaches out, and the people she finds appear. Her messages to the team float over the right edge. */
:root{
  --void:#03050b; --node:#5fb7da; --cyan-soft:#7fd6ee; --cream:#ece4d2; --amber:#d9a24a; --rust:#c8703f;
  --ink:#0f0e13; --ink-3:#1e1b25; --rule:#33303b; --rule-2:#4a4552; --muted:#b3ab9c; --faint:#8f887c; --body:#ece6d8;
  --display:"Bodoni Moda","Didot",Georgia,serif; --serif:"Libre Baskerville",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--body);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
svg#sky{position:fixed;top:0;left:0;bottom:0;width:50%;height:100%;display:block}
svg text{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;z-index:3;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
.mark{font-family:var(--display);font-style:italic;font-size:24px;color:var(--amber)}
.mark small{font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:12px}
.sp{flex:1}
.speed{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--rule-2);background:rgba(15,14,19,.85);border-radius:999px}
.speed button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:34px;padding:0 11px;border-radius:999px;cursor:pointer}
.speed button.on{background:var(--amber);color:var(--ink)}
.speed #pp[aria-pressed="true"]{background:var(--node);color:var(--ink)}
.speed button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.feed{position:fixed;z-index:3;top:calc(70px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:calc(50% - 22px);
  display:flex;flex-direction:column;background:rgba(10,12,18,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}
.feed header{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.07);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.feed header .ch{color:#fbf8f0} .feed header .sp{flex:1}
.list{flex:1;min-height:0;overflow:hidden;padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.msg{display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:start;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#2a2733,#020409 78%);border:1px solid var(--rule-2)}
.av img{width:56%}
.bubble{background:rgba(30,27,37,.85);border:1px solid var(--rule);border-left:3px solid var(--k,var(--rule-2));border-radius:4px 14px 14px 14px;padding:12px 14px 14px}
.sys .bubble{background:transparent}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.meta b{color:#fbf8f0;font-weight:600;letter-spacing:.06em}
.tag{color:var(--ink);border-radius:4px;padding:2px 6px;font-weight:600;background:var(--k)} .tag.run{color:#fbf8f0}
.h{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.15;color:#fbf8f0;margin:0 0 5px}
.p{margin:0;font-size:14.5px;line-height:1.5;color:var(--body)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s,color .4s}
.steps li.in{opacity:1;transform:none}
.steps li::before{content:"";flex:none;margin-top:3px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--faint)}
.steps li.ok{color:var(--body)} .steps li.ok::before{background:var(--k);border-color:var(--k);box-shadow:0 0 8px var(--k)}
.act{margin-top:10px;display:inline-flex;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink);background:var(--k);border:0;border-radius:9px;padding:8px 12px;opacity:0;transition:opacity .4s, transform .15s}
.act.in{opacity:1} .act.press{transform:scale(.94)} .act.done{background:transparent;color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.foot{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6a6f7a;padding:9px 18px;border-top:1px solid rgba(255,255,255,.07)}
@media (max-width:860px){ .feed{left:12px;right:12px;width:auto;top:auto;height:52vh} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg id="sky" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid meet" aria-label="The Sky, with Maybelle reaching out to where it is thin, running out, or about to be worth more">

  <div class="list" id="list" aria-live="polite"></div>
</section>

const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
const mk=(tag,attrs,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };
let seed=7; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<220;i++) mk('circle',{cx:(rnd()*800).toFixed(1),cy:(rnd()*900).toFixed(1),r:(.4+rnd()*.9).toFixed(2),fill:'#c9d6e6',opacity:(.05+rnd()*.18).toFixed(2)},$('stars'));

/* the memory: a web of names, plus the places Maybelle watches */
const ME={x:150,y:450};
const T={
  thin:{x:520,y:210,k:'n',label:'Nashville Sound',sub:'thin'},
  run:{x:560,y:610,k:'r',label:'Buddy Guy',sub:'90'},
  lp:{x:300,y:760,k:'a',label:'Bristol Sessions',sub:'100 in 2027'}
};
const BG=[]; for(let i=0;i<16;i++){ const x=40+rnd()*720, y=60+rnd()*800; if(Math.hypot(x-ME.x,y-ME.y)<110 || Object.values(T).some(t=>Math.hypot(x-t.x,y-t.y)<120)) continue; BG.push({x,y,k:'n'}); }

/* the Nashville Sound is a faint cluster, the others are single lit names */

  mk('line',{x1:T.thin.x,y1:T.thin.y,x2:T.thin.x+dx,y2:T.thin.y+dy,stroke:'#2c4f60','stroke-width':1,opacity:.5},$('edges')); return c; });

  const subTxt=p.sub;

HER.state=mk('text',{x:ME.x,y:ME.y+108,fill:'#8f887c','text-anchor':'middle',style:'font-size:10.5px'},$('her')); HER.state.textContent='watching the memory';

/* clock */

const at=(ms,f)=>Q.push({id:++QID,due:ms,f});
const reach=[], found=[];
function setLit(on, txt){ LIT=on?1:0; HER.state.textContent = txt || (on?'posting to the team':'watching the memory'); HER.state.setAttribute('fill', on?'#7fd6ee':'#8f887c'); }
function focus(ids){ ids.forEach(id=>{ const p=T[id]; p.sub.setAttribute('opacity',1); p.lab.setAttribute('opacity',1); p.ring.setAttribute('opacity',.9); p.glow.setAttribute('opacity',id==='thin'?.7:.95); p.hot=true;
  const l=mk('line',{x1:ME.x,y1:ME.y,x2:ME.x,y2:ME.y,stroke:'#7fd6ee','stroke-width':1.5,'stroke-dasharray':'4 6',opacity:.9},$('reach')); reach.push({l,p,t0:VT}); }); }
function unfocus(ids){ ids.forEach(id=>{ const p=T[id]; p.hot=false; p.ring.setAttribute('opacity',0); p.glow.setAttribute('opacity',id==='thin'?.45:.55); }); reach.forEach(r=>{ if(ids.some(id=>T[id]===r.p)) r.l.setAttribute('opacity',.25); }); }
function spawn(id, n, col, rad){ const p=T[id];
  for(let i=0;i<n;i++){ const base={thin:Math.PI/2,run:Math.PI/2,lp:-Math.PI/2}[id]; const a=base + (i-(n-1)/2)*0.85, x=p.x+Math.cos(a)*rad, y=p.y+Math.sin(a)*rad;
    const g=mk('g',{opacity:0},$('found'));
    mk('line',{x1:p.x,y1:p.y,x2:x,y2:y,stroke:col,'stroke-width':1.4,opacity:.8},g);
    mk('circle',{cx:x,cy:y,r:20,fill:`url(#${col==='#ece4d2'?'gC':(col==='#d9a24a'?'gA':'gN')})`},g);
    mk('circle',{cx:x,cy:y,r:6.5,fill:col},g);
    found.push({g,t0:VT+i*350}); } }

const MSGS = [
  { k:null, time:'9:02 am', title:'Three signals to watch.', body:'I check the memory for where it is thin, where time is running out, and where a story is about to be worth more. When I see one, I go find the people who hold it.' },
  { k:'thin', ids:['thin'], tag:'Thin', time:'9:14 am', title:'The Nashville Sound is thin.', body:'Harold Bradley played on hundreds of these records. The map has two firsthand accounts of him, and they disagree about his tic-tac bass.',
    steps:['Looked for people who knew Harold and his instruments','Found Joe Glaser and Andy Reiss','Suggested they talk'], spawnAt:1, spawn:[['thin',2,'#ece4d2',150]],
    act:'Approve and send 3 invites', done:'Sent · 3 invites out' },
  { k:'run', ids:['run'], tag:'Running out', time:'9:31 am', title:'Buddy Guy is 90.', body:'He turned 90 on July 30. The people who played beside him are older than that.',
    steps:['Moved Chicago blues to the top of my list','Looking for the players from his early records, and their families','First Rounds proposed for this week'], spawnAt:1, spawn:[['run',2,'#ece4d2',120]],
    act:'Approve the Rounds', done:'Approved · invites out today' },
  { k:'worth', ids:['lp'], tag:'About to be worth more', time:'9:48 am', title:'The Bristol Sessions turn 100 next summer.', body:'Ralph Peer recorded the Carter Family and Jimmie Rodgers in Bristol in the summer of 1927. A story told before the anniversary is worth more after it.',
    steps:['Found families and fans who carry those stories','Set up a series of Rounds before the anniversary'], spawnAt:0, spawn:[['lp',3,'#d9a24a',110]],
    act:'Approve the Rounds', done:'Rounds scheduled' }
];
const KC={ thin:'#5fb7da', run:'#c8703f', worth:'#d9a24a' };
function trim(){ const l=$('list'); while(l.scrollHeight > l.clientHeight + 4 && l.children.length > 1) l.removeChild(l.firstElementChild); }
function post(m){
  const el=document.createElement('div'); el.className='msg'+(m.k?'':' sys'); el.style.setProperty('--k', m.k?KC[m.k]:'var(--rule-2)');
  el.innerHTML=`<div class="av"><img src="${SEAL}" alt=""></div><div class="bubble"><div class="meta"><b>Maybelle</b>${m.tag?`<span class="tag ${m.k}">${m.tag}</span>`:''}<span>${m.time}</span></div><p class="h"></p><p class="p"></p>
    ${m.steps?`<ul class="steps">${m.steps.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}${m.act?`<button class="act" type="button" tabindex="-1">${m.act}</button>`:''}</div>`;
  el.querySelector('.h').textContent=m.title; el.querySelector('.p').textContent=m.body; $('list').appendChild(el); trim(); $('clock').textContent='Mon '+m.time; return el; }

function reset(){
  Q=[]; VT=0; $('list').innerHTML=''; $('reach').innerHTML=''; $('found').innerHTML=''; reach.length=0; found.length=0; setLit(false);
  Object.values(T).forEach(p=>{ p.hot=false; p.sub.setAttribute('opacity',0); p.lab.setAttribute('opacity',.8); p.ring.setAttribute('opacity',0); p.glow.setAttribute('opacity',p===T.thin?.25:.55); });
  T.thin.members.forEach(c=>c.setAttribute('opacity',.35));
  let t=700;
  MSGS.forEach(m=>{ let el;
    at(t,()=>{ setLit(true); el=post(m); if(m.ids) focus(m.ids); });
    t += m.k ? 2400 : 3600;
    (m.steps||[]).forEach((s,i)=>{
      at(t,()=>el.querySelectorAll('.steps li')[i].classList.add('in'));
      at(t+900,()=>{ el.querySelectorAll('.steps li')[i].classList.add('ok'); trim(); if(i===m.spawnAt){ m.spawn.forEach(a=>spawn(...a)); if(m.k==='thin') T.thin.members.forEach(c=>c.setAttribute('opacity',.7)); setLit(true,'going to find them'); } });
      t += 1500; });
    if(m.act){
      at(t,()=>{ el.querySelector('.act').classList.add('in'); setLit(false,'waiting on the team'); trim(); }); t+=1600;
      at(t,()=>el.querySelector('.act').classList.add('press'));
      at(t+200,()=>{ const b=el.querySelector('.act'); b.classList.remove('press'); b.classList.add('done'); b.textContent='✓ '+m.done; setLit(true,'invites going out'); }); t+=1800;
      at(t,()=>{ unfocus(m.ids); setLit(false); }); t+=900;
    } else { at(t,()=>setLit(false)); t+=600; }
  });
  at(t+3200, reset);
}

function frame(now){
  if(!PAUSED) VT+=(now-last)*SPEEDX; last=now;
  for(let g=0; g<40; g++){ let i=-1,b=Infinity; Q.forEach((q,j)=>{ if(q.due<b){b=q.due;i=j} }); if(i<0||b>VT) break; const q=Q.splice(i,1)[0]; try{q.f()}catch(e){} }
  const T2=VT/1000, L=LIT;
  HER.glow.setAttribute('r',(90+L*40+Math.sin(T2*(L?3:.5))*8).toFixed(1)); HER.glow.setAttribute('opacity',(.45+L*.45).toFixed(2));
  HER.r1.setAttribute('r',(44+Math.sin(T2*(L?4:.6))*(L?5:2)).toFixed(1)); HER.r1.setAttribute('opacity',(.35+L*.55).toFixed(2));
  HER.r2.setAttribute('r',(60+Math.sin(T2*(L?2.6:.4)+1)*(L?7:3)).toFixed(1)); HER.r2.setAttribute('opacity',(.18+L*.5).toFixed(2));
  HER.img.setAttribute('opacity',L?1:.85);
  reach.forEach(r=>{ const k=Math.min(1,(VT-r.t0)/900), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    r.l.setAttribute('x2',(ME.x+(r.p.x-ME.x)*e).toFixed(1)); r.l.setAttribute('y2',(ME.y+(r.p.y-ME.y)*e).toFixed(1)); r.l.setAttribute('stroke-dashoffset',(-T2*16).toFixed(1)); });
  found.forEach(f=>{ const k=Math.max(0,Math.min(1,(VT-f.t0)/500)); f.g.setAttribute('opacity',k.toFixed(2)); });
  Object.values(T).forEach(p=>{ if(p.hot){ p.ring.setAttribute('r',(30+Math.sin(T2*3)*4).toFixed(1)); } });
  requestAnimationFrame(frame);
}
document.querySelectorAll('.speed [data-x]').forEach(b=>b.addEventListener('click',()=>{ SPEEDX=parseFloat(b.dataset.x); document.querySelectorAll('.speed [data-x]').forEach(x=>x.classList.toggle('on',x===b)); }));
$('pp').addEventListener('click',()=>{ PAUSED=!PAUSED; $('pp').setAttribute('aria-pressed',String(PAUSED)); $('pp').textContent=PAUSED?'Play':'Pause'; });
$('rs').addEventListener('click',()=>{ PAUSED=false; $('pp').setAttribute('aria-pressed','false'); $('pp').textContent='Pause'; reset(); });
window.addEventListener('resize',trim);
reset(); requestAnimationFrame(t=>{ last=t; frame(t); });

/* scroll control: the page sets this demo to any moment (ms of its own time); going back starts it over */
window.__seek=function(t){ PAUSED=true; if(window.__sT===undefined||t<window.__sT){ reset(); PAUSED=true; } window.__sT=t;
  for(let g=0;g<20000;g++){ let i=-1,b=Infinity; for(let j=0;j<Q.length;j++) if(Q[j].due<b){b=Q[j].due;i=j} if(i<0||b>t) break; VT=b; const q=Q[i]; if(q.every) q.due+=q.every; else Q.splice(i,1); try{q.f()}catch(e){} }
  VT=t; };
</script>
