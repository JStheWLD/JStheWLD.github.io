<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Living Memory: stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the memory on the left, the open story on the right, as the product shows it. Two stories alternate: one corroborated, one in conflict. */
:root{
  --void:#03050b; --node:#5fb7da; --cyan-soft:#7fd6ee; --cream:#ece4d2; --amber:#d9a24a; --rust:#c8703f;
  --ink:#0f0e13; --rule:#33303b; --rule-2:#4a4552; --muted:#b3ab9c; --faint:#8f887c; --body:#ece6d8;
  --display:"Bodoni Moda","Didot",Georgia,serif; --serif:"Libre Baskerville",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--body);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
svg#sky{position:fixed;top:0;left:0;bottom:0;width:50%;height:100%;display:block}
svg text{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;z-index:3;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
.mark{font-family:var(--display);font-style:italic;font-size:24px;color:var(--amber)}
.mark small{font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:12px}
.sp{flex:1}
.speed{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--rule-2);background:rgba(15,14,19,.85);border-radius:999px}
.speed button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:34px;padding:0 11px;border-radius:999px;cursor:pointer}
.speed button.on{background:var(--amber);color:var(--ink)}
.speed #pp[aria-pressed="true"]{background:var(--node);color:var(--ink)}
.speed button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.story{position:fixed;z-index:3;top:calc(70px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:calc(50% - 22px);
  background:rgba(10,12,18,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:26px 30px;overflow:hidden;display:flex;flex-direction:column;transition:opacity .5s}
.story.out{opacity:0}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.title{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.1;color:#fbf8f0;margin:10px 0 6px}
.when{font-size:14px;color:var(--muted);font-style:italic}
.status{align-self:flex-start;margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:7px 12px;
  border:1px solid var(--rule-2);color:var(--faint);transition:all .5s}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.ok{color:var(--ink);background:var(--cyan-soft);border-color:transparent}
.status.cf{color:var(--ink);background:var(--amber);border-color:transparent}
.sec{margin-top:22px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);display:flex;gap:10px;align-items:center}
.sec b{color:var(--body);font-weight:600}
.rows{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rows li{display:grid;grid-template-columns:18px 1fr;gap:12px;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.rows li.in{opacity:1;transform:none}
.rows li::before{content:"";width:12px;height:12px;margin-top:4px;border-radius:50%;background:var(--c,var(--cyan-soft));box-shadow:0 0 8px var(--c,var(--cyan-soft))}
.rows .line{font-size:15px;line-height:1.5;color:#f4efe4}
.rows .src{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ver{border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:10px;padding:12px 14px;background:rgba(30,27,37,.6);opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.ver.in{opacity:1;transform:none}
.ver .line{font-family:var(--display);font-size:19px;line-height:1.25;color:#fbf8f0}
.ver .src{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.note{margin-top:14px;font-size:13.5px;color:var(--muted);opacity:0;transition:opacity .5s}
.note.in{opacity:1}
@media (max-width:860px){ svg#sky{width:100%;height:45%} .story{left:12px;right:12px;width:auto;top:46%} .vs{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg id="sky" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid meet" aria-label="The Living Memory">
  <defs>
    <radialGradient id="gN"><stop offset="0" stop-color="#5fb7da" stop-opacity=".45"/><stop offset="1" stop-color="#5fb7da" stop-opacity="0"/></radialGradient>
    <radialGradient id="gA"><stop offset="0" stop-color="#d9a24a" stop-opacity=".5"/><stop offset="1" stop-color="#d9a24a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gR"><stop offset="0" stop-color="#c8703f" stop-opacity=".55"/><stop offset="1" stop-color="#c8703f" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC"><stop offset="0" stop-color="#ece4d2" stop-opacity=".55"/><stop offset="1" stop-color="#ece4d2" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="stars"></g><g id="edges"></g><g id="live"></g><g id="nodes"></g><g id="cloud"></g><g id="labels"></g>
</svg>
<div class="top">
  <span class="mark">Maybelle<small>The Living Memory · stories</small></span>
  <span class="sp"></span>
  <div class="speed" role="group" aria-label="Demo speed"><button type="button" id="pp" aria-pressed="false">Pause</button><button type="button" data-x="0.5">½×</button><button type="button" data-x="1" class="on">1×</button><button type="button" data-x="2">2×</button><button type="button" data-x="4">4×</button><button type="button" id="rs">Restart</button></div>
</div>
<section class="story out" id="story" aria-live="polite"></section>
<script>
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
const mk=(tag,a,p)=>{ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; };
let seed=5; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<220;i++) mk('circle',{cx:(rnd()*800).toFixed(1),cy:(rnd()*900).toFixed(1),r:(.4+rnd()*.9).toFixed(2),fill:'#c9d6e6',opacity:(.05+rnd()*.18).toFixed(2)},$('stars'));

/* two stories live in the same patch of memory */
const S={x:400,y:430};
const BG=[]; for(let i=0;i<16;i++){ const x=40+rnd()*720, y=80+rnd()*780; if(Math.hypot(x-S.x,y-S.y)<230) continue; BG.push({x,y}); }
BG.forEach((p,i)=>{ const q=BG[(i+3)%BG.length]; if(Math.hypot(q.x-p.x,q.y-p.y)<330) mk('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,stroke:'#2c4f60','stroke-width':1,opacity:.45},$('edges')); });
BG.forEach(p=>{ mk('circle',{cx:p.x,cy:p.y,r:20,fill:'url(#gN)',opacity:.55},$('nodes')); mk('circle',{cx:p.x,cy:p.y,r:(4.5+rnd()*2.5).toFixed(1),fill:'#5fb7da'},$('nodes')); });
const story={ glow:mk('circle',{cx:S.x,cy:S.y,r:50,fill:'url(#gC)',opacity:.6},$('nodes')), dot:mk('circle',{cx:S.x,cy:S.y,r:12,fill:'#ece4d2'},$('nodes')) };
const sLab=mk('text',{x:S.x,y:S.y-34,fill:'#ece6d8','text-anchor':'middle'},$('labels'));

/* voices around the story */
const VOX=[[-200,-170],[190,-190],[220,150],[-190,180]].map(([dx,dy])=>({x:S.x+dx,y:S.y+dy}));
const vEls=VOX.map(v=>{ const g=mk('g',{opacity:0},$('nodes')); mk('circle',{cx:v.x,cy:v.y,r:24,fill:'url(#gN)'},g); mk('circle',{cx:v.x,cy:v.y,r:8,fill:'#7fd6ee'},g); return g; });
const vLines=VOX.map(v=>mk('line',{x1:v.x,y1:v.y,x2:v.x,y2:v.y,stroke:'#7fd6ee','stroke-width':2,opacity:0},$('live')));
/* the two versions, and the cloud between them */
const VA={x:S.x-170,y:S.y+250}, VB={x:S.x+180,y:S.y+250};
const verEls=[[VA,'#d9a24a','gA'],[VB,'#c8703f','gR']].map(([p,c,g])=>{ const e=mk('g',{opacity:0},$('nodes')); mk('circle',{cx:p.x,cy:p.y,r:36,fill:`url(#${g})`},e); mk('circle',{cx:p.x,cy:p.y,r:10,fill:c},e); return e; });
const CL=[[0,0,30],[-25,10,24],[24,8,26],[-10,22,20],[14,24,22],[40,20,19]].map(([dx,dy,r],i)=>({dx,dy,r,ph:i*1.7,el:mk('circle',{r,fill:'rgba(236,228,210,.07)',stroke:'rgba(236,228,210,.5)','stroke-width':1.1,opacity:0},$('cloud'))}));
const C={x:S.x,y:S.y+205};
const dA=mk('line',{x1:C.x,y1:C.y,x2:VA.x,y2:VA.y,stroke:'#d9a24a','stroke-width':1.5,'stroke-dasharray':'4 6',opacity:0},$('live'));
const dB=mk('line',{x1:C.x,y1:C.y,x2:VB.x,y2:VB.y,stroke:'#d9a24a','stroke-width':1.5,'stroke-dasharray':'4 6',opacity:0},$('live'));
const dS=mk('line',{x1:C.x,y1:C.y,x2:S.x,y2:S.y,stroke:'#d9a24a','stroke-width':1.5,'stroke-dasharray':'4 6',opacity:0},$('live'));

/* the two stories */
const STORIES=[
  { label:'Harold Bradley', crumb:'Story · Nashville sessions', title:'Harold Bradley’s tic-tac bass', when:'Bradley Studios and RCA Studio B, Nashville · late 1950s',
    sec:'Accounts that agree', rows:[
      ['He played tic-tac bass on Patsy Cline’s “I Fall to Pieces,” doubling Bob Moore’s upright.','Reverb · Danelectro’s UB-2 and the Early Days of 6-String Basses'],
      ['He probably played tic-tac on more sessions than anyone. “Crazy.” “Thanks a Lot.”','Steel Guitar Forum · 2001'],
      ['By 1958 he was known as the tic-tac bass guy.','Deke Dickerson · 2026']],
    vs:[['#d9a24a','A Danelectro six-string bass, the UB-2, first sold in 1956.','Reverb · Vintage Guitar'],['#c8703f','A Danelectro baritone guitar, tuned down, through a Fender Deluxe Reverb.','Steel Guitar Forum · 2001']],
    vsec:'Which instrument', note:'Both versions kept. Andy Reiss plays tic-tac on a Danelectro. Ask him.',
    status:['cf','1 conflict · 2 versions kept'] }
];

function render(s){
  const el=$('story'); el.classList.add('out');
  el.innerHTML=`<div class="crumb">${s.crumb}</div><div class="title"></div><div class="when"></div><span class="status" id="st"><i></i>Checking</span>
    <div class="sec"><b>${s.sec}</b><span id="cnt"></span></div><ul class="rows">${s.rows.map(()=>`<li><span><span class="line"></span><span class="src"></span></span></li>`).join('')}</ul>
    ${s.vs?`<div class="sec"><b>${s.vsec}</b><span>2 versions</span></div><div class="vs">${s.vs.map(v=>`<div class="ver" style="--c:${v[0]}"><span class="line"></span><span class="src"></span></div>`).join('')}</div><div class="note" id="note"></div>`:''}`;
  el.querySelector('.title').textContent=s.title; el.querySelector('.when').textContent=s.when;
  el.querySelectorAll('.rows li').forEach((li,i)=>{ li.querySelector('.line').textContent=s.rows[i][0]; li.querySelector('.src').textContent=s.rows[i][1]; });
  if(s.vs) el.querySelectorAll('.ver').forEach((v,i)=>{ v.querySelector('.line').textContent=s.vs[i][1]; v.querySelector('.src').textContent=s.vs[i][2]; });
  if(s.note) $('note').textContent=s.note;
  sLab.textContent=s.label;
  setTimeout(()=>el.classList.remove('out'),60);
}

/* timeline on one clock */
let VT=0, SPEEDX=1, PAUSED=false, last=performance.now(), Q=[];
const at=(ms,f)=>Q.push({due:ms,f});
let strength=0, conflictOn=0, nVox=0;
function reset(){
  Q=[]; VT=0; strength=0; conflictOn=0; nVox=0;
  vEls.forEach(g=>g.setAttribute('opacity',0)); vLines.forEach(l=>l.setAttribute('opacity',0)); verEls.forEach(g=>g.setAttribute('opacity',0));
  let t=300; const s0=STORIES[0];
  at(t,()=>{ render(s0); });
  s0.rows.forEach((r,i)=>{ t+=1700; at(t,()=>{ $('story').querySelectorAll('.rows li')[i].classList.add('in'); nVox=i+1; vEls[i].setAttribute('opacity',1); vLines[i].dataset.t0=VT; vLines[i].setAttribute('opacity',.9); $('cnt').textContent=(i+1)+' of 3 agree'; }); });
  t+=1300; at(t,()=>{ const s=$('st'); s.className='status ok'; s.innerHTML='<i></i>Corroborated · 3 voices'; });
  t+=2600; at(t,()=>{ conflictOn=1; verEls[0].setAttribute('opacity',1); $('story').querySelectorAll('.ver')[0].classList.add('in'); });
  t+=1500; at(t,()=>{ verEls[1].setAttribute('opacity',1); $('story').querySelectorAll('.ver')[1].classList.add('in'); });
  t+=1300; at(t,()=>{ const s=$('st'); s.className='status cf'; s.innerHTML='<i></i>'+s0.status[1]; $('note').classList.add('in'); });
  t+=5600; at(t,()=>{ conflictOn=0; verEls.forEach(g=>g.setAttribute('opacity',0)); });
  at(t+300, reset);
}
function frame(now){
  if(!PAUSED) VT+=(now-last)*SPEEDX; last=now;
  for(let g=0; g<30; g++){ let i=-1,b=Infinity; Q.forEach((q,j)=>{ if(q.due<b){b=q.due;i=j} }); if(i<0||b>VT) break; const q=Q.splice(i,1)[0]; try{q.f()}catch(e){} }
  const T=VT/1000;
  vLines.forEach((l,i)=>{ if(+l.getAttribute('opacity')>0){ const k=Math.min(1,(VT-(+l.dataset.t0||0))/700), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    l.setAttribute('x2',(VOX[i].x+(S.x-VOX[i].x)*e).toFixed(1)); l.setAttribute('y2',(VOX[i].y+(S.y-VOX[i].y)*e).toFixed(1)); } });
  strength += ((nVox/3) - strength)*0.06;
  story.dot.setAttribute('r',(12+strength*8).toFixed(1)); story.glow.setAttribute('r',(50+strength*40+Math.sin(T*2)*3).toFixed(1)); story.glow.setAttribute('opacity',(.55+strength*.4).toFixed(2));
  CL.forEach(c=>{ c.el.setAttribute('cx',(C.x+c.dx+Math.sin(T*.9+c.ph)*5).toFixed(1)); c.el.setAttribute('cy',(C.y+c.dy+Math.cos(T*.8+c.ph)*4).toFixed(1)); c.el.setAttribute('opacity',conflictOn); c.el.setAttribute('r',(c.r*(1.08+Math.sin(T*2+c.ph)*.05)).toFixed(1)); });
  [dA,dB,dS].forEach(d=>{ d.setAttribute('opacity',conflictOn*.85); d.setAttribute('stroke-dashoffset',(-T*14).toFixed(1)); });
  requestAnimationFrame(frame);
}
document.querySelectorAll('.speed [data-x]').forEach(b=>b.addEventListener('click',()=>{ SPEEDX=parseFloat(b.dataset.x); document.querySelectorAll('.speed [data-x]').forEach(x=>x.classList.toggle('on',x===b)); }));
$('pp').addEventListener('click',()=>{ PAUSED=!PAUSED; $('pp').setAttribute('aria-pressed',String(PAUSED)); $('pp').textContent=PAUSED?'Play':'Pause'; });
$('rs').addEventListener('click',()=>{ PAUSED=false; $('pp').setAttribute('aria-pressed','false'); $('pp').textContent='Pause'; reset(); });
reset(); requestAnimationFrame(t=>{ last=t; frame(t); });
</script>
</body>
</html>
