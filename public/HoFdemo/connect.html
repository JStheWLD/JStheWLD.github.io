<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: the real Living Memory fills the screen; two phones sit on it, one per person Maybelle pairs. One status line, four counters. Autopilot plays the loop; Take over hands you the left phone. */
:root{
  --ink:#0f0e13; --ink-2:#16141b; --ink-3:#1e1b25; --rule:#33303b; --rule-2:#4a4552;
  --cream:#fbf8f0; --body:#ece6d8; --muted:#b3ab9c; --faint:#8f887c;
  --cyan:#40c4e8; --cyan-soft:#7fd6ee; --amber:#e0a54a; --rec:#c1512a;
  --display:"Bodoni Moda","Didot",Georgia,serif; --serif:"Libre Baskerville",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--body);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
canvas#map{position:fixed;inset:0;width:100%;height:100%}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));z-index:5}
.mark{font-family:var(--display);font-style:italic;font-size:24px;color:var(--amber);white-space:nowrap}.mark .x{font-style:normal;color:var(--muted);font-size:18px;margin:0 .35em}.mark .partner{font-family:'Archivo',ui-sans-serif,sans-serif;font-style:normal;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream)}
.sp{flex:1}
.ask{display:flex;gap:6px;width:min(380px,40vw);background:rgba(22,20,27,.9);border:1px solid var(--rule);border-radius:999px;padding:4px 4px 4px 14px}
.ask:focus-within{border-color:var(--amber)}
.ask input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--cream);font-family:var(--serif);font-size:14px}
.ask button{border:0;border-radius:999px;background:var(--amber);color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:600;padding:0 14px;min-height:34px;cursor:pointer}
.speed{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--rule-2);background:rgba(22,20,27,.9);border-radius:999px}.speed button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:34px;padding:0 11px;border-radius:999px;cursor:pointer}.speed button.on{background:var(--amber);color:var(--ink)}.speed #pp[aria-pressed="true"]{background:var(--cyan);color:var(--ink)}.speed button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pilot{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule-2);background:rgba(22,20,27,.9);color:var(--cream);border-radius:999px;padding:0 16px;min-height:42px;cursor:pointer}
.pilot i{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:pl 1.6s infinite}
.pilot[data-on="0"] i{background:var(--faint);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(224,165,74,.6)}70%{box-shadow:0 0 0 9px rgba(224,165,74,0)}100%{box-shadow:0 0 0 0 rgba(224,165,74,0)}}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule-2);background:rgba(22,20,27,.9);color:var(--muted);border-radius:999px;padding:0 12px;min-height:42px;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}

.counts b{display:block;font-family:var(--display);font-size:28px;letter-spacing:0;color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums;text-align:right;transition:color .4s}

.phone{position:fixed;top:54%;width:min(290px,26vw);height:min(580px,72vh);transform:translateY(-50%);border-radius:40px;background:#0b0a0e;border:2px solid var(--rule-2);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;z-index:3;transition:opacity .6s, transform .6s}

.phone.away{opacity:0;transform:translateY(-46%) scale(.96)}

.scr.on{opacity:1;pointer-events:auto}
.name{font-family:var(--display);font-size:22px;color:var(--cream);text-align:center;margin-top:24px}
.clockbig{font-family:var(--display);font-size:56px;text-align:center;color:var(--cream);line-height:1}

.notif p{margin:0;font-size:13.5px;line-height:1.45;color:var(--cream)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.h{font-family:var(--display);font-size:22px;color:var(--cream);font-weight:600;line-height:1.15;margin:0}

.clip{border-radius:16px;background:linear-gradient(165deg,#221f2a,#121117);border:1px solid rgba(224,165,74,.5);padding:14px;display:flex;flex-direction:column;gap:10px}

.bar.play i{animation:bar 4s linear forwards}
@keyframes bar{to{width:100%}}
.clipmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:6px;overflow:hidden}

.cin{display:flex;gap:6px;background:var(--ink-3);border:1px solid var(--rule);border-radius:12px;padding:4px}
.cin input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--cream);font-family:var(--serif);font-size:13.5px;padding:8px}
.cin button{border:0;border-radius:9px;background:var(--amber);color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:600;padding:0 12px;min-height:36px;cursor:pointer}
.mem{font-size:12px;background:var(--ink-3);border:1px solid var(--rule);border-radius:10px;padding:7px 9px}
.mem button{font-family:var(--mono);font-size:10px;border:1px solid var(--rule-2);background:transparent;color:var(--muted);border-radius:999px;padding:3px 8px;margin-left:6px;cursor:pointer}
.status{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,40vw);text-align:center;z-index:4;pointer-events:none}
.status .s{font-family:var(--display);font-size:clamp(20px,2.2vw,30px);color:var(--cream);line-height:1.2;animation:drop .5s ease both}
.status .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px}
.answer{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(440px,38vw);background:rgba(22,20,27,.95);border:1px solid rgba(224,165,74,.45);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--cream);z-index:4;animation:drop .4s ease both}
.answer .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;margin-bottom:6px}
.answer .k button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* faces: illustrated, invented tellers; the mouth moves while that person talks */
.face{position:absolute;inset:0;width:100%;height:100%;display:block}
.face .mouth{transform-box:fill-box;transform-origin:center}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.talk .face .mouth{animation:talk .55s infinite}
@keyframes talk{0%{transform:scaleY(1)}20%{transform:scaleY(3)}40%{transform:scaleY(1.5)}60%{transform:scaleY(3.4)}80%{transform:scaleY(1.2)}100%{transform:scaleY(1)}}
.face .hg{transform-box:view-box;transform-origin:100px 150px}
.talk .face .hg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}70%{transform:rotate(1.2deg)}}
.vid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.vt{overflow:hidden}
.vt .nm{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 1px 3px #000;z-index:1}
.vt .rec{z-index:1;color:#fff;text-shadow:0 1px 3px #000}
.vt.on{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(64,196,232,.55)}
.avs{display:flex;justify-content:center;margin:4px 0}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;border:2px solid #0b0a0e;margin-left:-12px;flex:none}
.av:first-child{margin-left:0}
.notif .avs{justify-content:flex-start;margin:0 0 6px}.notif .av{width:30px;height:30px;margin-left:-8px}.notif .av:first-child{margin-left:0}
.reel{padding:0;gap:0;background:#000}
.rows{position:absolute;inset:0 0 104px;display:flex;flex-direction:column;gap:2px}
.rows>div{flex:1;position:relative;overflow:hidden}
.rtop{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 1px 3px #000;z-index:2}
.cap{position:absolute;left:10px;right:12px;bottom:36px;text-align:center;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:20px;line-height:1.15;color:#fff;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.9);z-index:2;min-height:48px}
.cap em{font-style:normal;color:#ffd35a}
.cap small{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;opacity:.85;margin-bottom:4px}
.rside{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:14px;z-index:2;align-items:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-family:var(--mono);font-size:9.5px;text-shadow:0 1px 3px #000;transition:transform .2s}
.ic svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.ic.hot{color:#ff6b7d}.ic.sh.hot{color:var(--amber);transform:scale(1.18)}
.rby{position:absolute;left:12px;right:12px;bottom:18px;text-align:center;opacity:.8;font-family:var(--mono);font-size:9.5px;color:#fff;text-shadow:0 1px 3px #000;z-index:2}
.rbar{position:absolute;left:0;right:0;bottom:104px;height:3px;background:rgba(255,255,255,.25);z-index:2}
.rbar i{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .25s linear}
.post{background:#fbf8f0;color:#1b1a1f;border-radius:14px;overflow:hidden;animation:drop .5s ease both;flex:none}

.post b{font-family:var(--serif);font-size:12px;font-weight:700}.post small{display:block;font-size:10px;color:#6b665c}
.post p{margin:0 10px 8px;font-size:12.5px;line-height:1.35}
.pv{display:grid;height:104px;position:relative;gap:2px;background:#000}.pv>div{position:relative;overflow:hidden}
.play{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff}
.play::after{content:"";position:absolute;left:14px;top:10px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.pl{padding:7px 10px;font-size:11px;color:#4a463f;border-top:1px solid #e3ddd0;font-family:var(--mono)}
.feed div.mb{border:1px solid rgba(224,165,74,.45)}
@media (max-width:900px){ body{overflow:auto} .phone{position:relative;top:auto;transform:none;width:min(320px,90vw);height:560px;margin:20px auto 0;left:auto!important;right:auto!important} .phone.away{transform:none} .status,.answer{position:relative;left:auto;transform:none;width:auto;margin:16px 20px} .counts{position:relative;top:auto;right:auto;justify-content:center;margin-top:70px} .ask{width:auto;flex:1} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="map" aria-label="The Living Memory, live"></canvas>
<div class="top">
  <span class="mark">Maybelle<i class="x">×</i><span class="partner">Hall of Fame</span></span>
  <form class="ask" id="askForm" autocomplete="off"><input id="askIn" placeholder="Ask her about any name in American music" aria-label="Ask about a name"><button type="submit">Ask</button></form>
  <span class="sp"></span>
  <button class="btn" id="voice" type="button" aria-pressed="false" hidden>Voice</button>
  <div class="speed" role="group" aria-label="Demo speed"><button type="button" id="pp" aria-pressed="false">Pause</button><button type="button" data-x="0.5">½×</button><button type="button" data-x="1" class="on">1×</button><button type="button" data-x="2">2×</button><button type="button" data-x="4">4×</button><button type="button" id="rs">Restart</button></div>
  <button class="pilot" id="pilot" type="button" data-on="1"><i></i><span id="pilotTxt">Autopilot · Take over</span></button>
</div>

<div class="phone" id="phA">
  <div class="scr" id="A4"><div class="thread" id="thread"></div><div id="memBox"></div><form class="cin" id="chatForm" autocomplete="off"><input id="chatIn" placeholder="Your answer" aria-label="Your answer"><button type="submit">Send</button></form></div>
</div>
<div class="phone" id="phB"></div>
<div class="status" id="status"><div class="s" id="sLine"></div><div class="n" id="sNote"></div></div>
<div id="answerBox"></div>

<script>
(async function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LM={nodes:[],edges:[]}; try{ LM=await (await fetch('lm.json')).json() }catch(e){}
const byId=new Map(LM.nodes.map(n=>[n.id,n])); const adj=new Map();
LM.edges.forEach((e,i)=>{ e.i=i; for(const k of [e.f,e.t]){ if(!adj.has(k)) adj.set(k,[]); adj.get(k).push(e) } });
const deg=id=>(adj.get(id)||[]).length, label=id=>(byId.get(id)||{}).l||id;
const flat=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const FLAGS={one_voice:'rests on one voice',thin:'has a thin record',dead_end:'is a dead end so far',untold:'has no firsthand account yet',undated:'has no date yet'};
function find(q){ const k=flat(q); if(!k) return []; const r=[]; for(const n of LM.nodes){ const l=flat(n.l); let s=l===k?100:l.startsWith(k)?60:l.includes(k)?40:0; if(!s){ const w=k.split(' ').filter(x=>x.length>2); if(w.length&&w.every(x=>l.includes(x))) s=30 } if(s) r.push([s+deg(n.id)/10,n]) } return r.sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]) }
const HUMAN_VERB=v=>String(v||'').replace(/_/g,' ');

/* counters */
const C={stories:0,people:0,calls:0,shares:0};
function add(k,n){ C[k]+=n; const el=$('c'+k[0].toUpperCase()+k.slice(1)); el.textContent=C[k].toLocaleString('en-US'); el.classList.add('up'); setTimeout(()=>el.classList.remove('up'),700) }

/* capabilities */
let sample=null,tts=null,voiceOn=false;
const capP=(async()=>{ try{sample=await window.claude?.use?.('sample')}catch(e){} try{tts=await window.claude?.use?.('tts')}catch(e){} if(tts) $('voice').hidden=false })();
$('voice').onclick=e=>{ voiceOn=!voiceOn; e.currentTarget.setAttribute('aria-pressed',voiceOn); if(!voiceOn&&tts) try{tts.stop()}catch(_){} };
const speak=t=>{ if(voiceOn&&tts&&t) tts.speak(String(t).slice(0,1900)).catch(()=>{}) };

/* map */
const cv=$('map'), cx=cv.getContext('2d'); let W=0,H=0; const P=new Map();
let focus=null, focusNb=new Set(), born=[], ripples=[], wave=null, link=null;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }
function layout(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0);

  at(t+=2400,()=>{ [['A',ka],['B',kb]].forEach(([p,k])=>{ const o=others(k); $(p+'0n').innerHTML=`<div class="notif"><b>Maybelle</b><div class="avs">${avs(o)}</div><p>${grp?esc(listNames(o))+' were':esc(nm(o[0]))+' was'} there for ${esc(c.session)} too. ${grp?'Talk together?':'You two should talk.'}</p></div>` }); status('She introduces them, and says why.') });
  at(t+=2200,()=>{ [['A',ka],['B',kb]].forEach(([p,k])=>{ const o=others(k); $(p+'1v').innerHTML=avs([k,...o]); $(p+'1h').textContent=grp?`A Round: you, ${listNames(o)}, about ${c.session}.`:`You and ${nm(o[0])}, about ${c.session}.`; $(p+'1p').textContent=grp?'Four people, four sides of one night. The others have said yes if you do.':`You remember it from different sides. ${first(o[0])} has said yes if you do.`; scr(p,1) }) });
  at(t+=2200,()=>{ press($('A1b')); $('A1b').classList.add('done'); $('A1b').textContent=grp?'Yes · 3 of 4 in':'Yes · waiting for '+first(kb) });
  at(t+=1200,()=>{ press($('B1b')); $('B1b').classList.add('done'); const lab=(grp?'Round':'Paired')+' · Thursday, 4 pm'; $('B1b').textContent=lab; $('A1b').textContent=lab; add('calls',1); c.ppl.forEach(meet); status(grp?'All four say yes. Maybelle schedules the Round.':'Both say yes. Maybelle schedules the call.') });
  at(t+=2000,()=>{ ['A','B'].forEach(p=>{ const v=$(p+'2v'); v.className='vid '+(grp?'n4':'n2'); v.innerHTML=c.ppl.map((k,i)=>`<div class="vt" data-k="${k}">${i===0?'<span class="rec">Recording</span>':''}${face(k)}<span class="nm">${esc(nm(k))}</span></div>`).join(''); $(p+'2c').innerHTML=''; scr(p,2) }); status(grp?'Four people on one call. She hosts, and keeps every word.':'They talk. She listens, and keeps every word.',(PPL[ka].real?'real conversation, Gearcheck, Oct 2026 · the pairing is shown as a demo':'the conversation is invented for this demo'));
    let s=0; const tm=vInterval(()=>{ s++; ['A2t','B2t'].forEach(i=>$(i).textContent='00:'+String(s).padStart(2,'0')) },1000); timers.push(tm) });
  const OFF=[]; let acc=800; c.call.forEach(l=>{ OFF.push(acc); acc+=Math.max(2600,l[1].split(' ').length*260) });
  c.call.forEach((l,k)=>at(t+OFF[k],()=>{ const who=l[0]==='m'?null:c.ppl[l[0]];
    ['A','B'].forEach(p=>{ $(p+'2v').querySelectorAll('.vt').forEach(x=>{ const on=x.dataset.k===who; x.classList.toggle('on',on); x.classList.toggle('talk',on) }); const box=$(p+'2c'); box.className='mbline'+(who?' them':''); box.innerHTML=`<b>${who?esc(nm(who)):'Maybelle'}</b>${esc(l[1])}` });
    if(who){ add('stories',1); grow(first(who)) } }));
  t+=acc;
  at(t+=400,()=>{ ['A','B'].forEach(p=>{ $(p+'3r').innerHTML=rowsK.map(k=>`<div data-k="${k}">${face(k)}</div>`).join(''); $(p+'3y').textContent=listNames(rowsK).replace(' and ',' & ')+' · Maybelle × Hall of Fame'; scr(p,3) }); status('From the recording, she cuts a clip they can post.','vertical, captioned, ready to share') });
  const seq=[]; c.clip.forEach(([i,txt])=>{ const w=txt.split(' '); w.forEach((_,j)=>seq.push({k:c.ppl[i],w,j})) }); const STEP=270;
  at(t+=500,()=>{ let n=0; const iv=vInterval(()=>{ if(!auto||n>=seq.length){ vClear(iv); ['A','B'].forEach(p=>$(p+'3r').querySelectorAll('.talk').forEach(x=>x.classList.remove('talk'))); return }
      const s=seq[n], st=s.j-(s.j%4), chunk=s.w.slice(st,st+4).map((w,q)=>st+q===s.j?`<em>${esc(w)}</em>`:esc(w)).join(' ');
      ['A','B'].forEach(p=>{ $(p+'3c').innerHTML=`<small>${esc(nm(s.k))}</small>${chunk}`; $(p+'3r').querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('talk',x.dataset.k===s.k)); $(p+'3p').style.transform=`scaleX(${(n+1)/seq.length})`; $(p+'3d').textContent='0:'+String(Math.round((n+1)/seq.length*42)).padStart(2,'0') }); n++ },STEP*SPD); timers.push(iv) });
  t+=seq.length*STEP;
  at(t+=500,()=>{ const s=$('A3s'); press(s); s.classList.add('hot'); span('A3s').textContent='Shared'; add('shares',1); const p=phoneXY('phA'); ripples.push({x:p.x,y:p.y,R:Math.min(W,H)*.4,n:18,s:Math.random(),t:performance.now()}); status('They post it.') });
  at(t+=800,()=>{ const s=$('B3s'); press(s); s.classList.add('hot'); span('B3s').textContent='Shared'; add('shares',1); const p=phoneXY('phB'); ripples.push({x:p.x,y:p.y,R:Math.min(W,H)*.4,n:18,s:Math.random(),t:performance.now()});
    ['A','B'].forEach(q=>{ $(q+'3l').classList.add('hot'); ramp(span(q+'3l'),c.likes,1100); ramp(span(q+'3m'),c.comments,1100) }); add('shares',c.reshares); status('People who love that music share it on.','the counts and replies on the phones are illustrative') });
  at(t+=2600,()=>{ const f=c.fan; $('whoB').textContent=`invented · ${nm(f)}’s phone`; $('B4k').textContent=`${first(f)}’s feed`;
    $('B4post').innerHTML=`<div class="ph"><div class="av">${face(rowsK[0])}</div><div><b>${esc(rowsK.map(first).join(' & '))}</b><small>shared a clip from Maybelle × Hall of Fame</small></div></div><p>${esc(c.title)}</p><div class="pv" style="grid-template-columns:repeat(${rowsK.length},1fr)">${rowsK.map(k=>`<div>${face(k)}</div>`).join('')}<span class="play"></span></div><div class="pl">♥ ${c.likes.toLocaleString('en-US')} · ${c.comments} comments</div>`;
    scr('B',4); link=null; status(`The clip reaches <i>${esc(nm(f))}</i>, who has a story too.`,'invented fan · the counts are illustrative') });
  at(t+=2000,()=>{ $('B4f').insertAdjacentHTML('beforeend',`<div><b>${esc(first(c.fan))}:</b> “${esc(c.fanLine)}”</div>`) });
  at(t+=1800,()=>{ $('B4f').insertAdjacentHTML('beforeend',`<div class="mb"><b>Maybelle:</b> ${esc(first(c.fan))}, would you tell yours? I’ll put you with people who carry the same story.</div>`); status(`Maybelle replies, and invites ${esc(first(c.fan))} in.`) });
  at(t+=2000,()=>{ const b=$('B4b'); press(b); b.classList.add('done'); b.textContent='Yes · I’m in'; meet(c.fan); grow(first(c.fan)); const nx=CAST[round%CAST.length]; status(`${esc(first(c.fan))} says yes. The next ${nx.ppl.length>2?'Round':'pair'} begins.`) });
  at(t+=2600,runAuto) }

/* TAKE OVER: the left phone is you; ask her about any name from the top */
const MEMKEY='maybelle-you'; let mem=null; try{ mem=JSON.parse(localStorage.getItem(MEMKEY)||'null') }catch(_){}
const convo=[];
function bub(w,t){ const d=document.createElement('div'); d.className='bb '+w; d.textContent=t; $('thread').appendChild(d); $('thread').scrollTop=1e9; if(w==='m'&&t) speak(t); return d }
function memLine(){ $('memBox').innerHTML=mem&&mem.first?`<div class="mem">She remembers: “${esc(String(mem.first).slice(0,60))}…”<button type="button" id="forget">Forget</button></div>`:''; const f=$('forget'); if(f) f.onclick=()=>{ mem=null; try{localStorage.removeItem(MEMKEY)}catch(_){} $('memBox').innerHTML='<div class="mem">Forgotten.</div>' } }
function takeOver(){ if(!auto) return; auto=false; clearT(); link=null; $('pilot').dataset.on='0'; $('pilotTxt').textContent='Your turn · Autopilot'; $('phB').classList.add('away'); $('whoA').textContent='your phone';
  scr('A',4); $('thread').innerHTML=''; convo.length=0;
  const open=mem&&mem.first?`Welcome back. Last time you told me: “${String(mem.first).slice(0,100)}”. Pick up there, or tell me another moment?`:'Hi, I’m Maybelle, an AI. Pick one moment you were in the room for. Where were you, and what happened?';
  bub('m',open); convo.push({role:'assistant',content:open}); memLine(); status('Your turn. Tell her a moment, or ask about any name above.','') }
document.querySelectorAll('.speed [data-x]').forEach(b=>b.addEventListener('click',()=>{ SPEEDX=parseFloat(b.dataset.x); document.querySelectorAll('.speed [data-x]').forEach(x=>x.classList.toggle('on',x===b)) }));
$('pp').addEventListener('click',()=>{ PAUSED=!PAUSED; $('pp').setAttribute('aria-pressed',String(PAUSED)); $('pp').textContent=PAUSED?'Play':'Pause' });
$('rs').addEventListener('click',()=>{ PAUSED=false; $('pp').setAttribute('aria-pressed','false'); $('pp').textContent='Pause'; round=0; if(!auto) resume(); else runAuto() });
window.__demo={ start:x=>{ PAUSED=false; SPEEDX=x; Object.keys(C).forEach(k=>{ C[k]=0; const el=$('c'+k[0].toUpperCase()+k.slice(1)); if(el) el.textContent='0'; }); seen.clear(); round=0; if(!auto) resume(); else runAuto(); }, speed:x=>{ SPEEDX=x; }, pause:p=>{ PAUSED=p; } };
function resume(){ auto=true; $('pilot').dataset.on='1'; $('pilotTxt').textContent='Autopilot · Take over'; $('phB').classList.remove('away'); $('answerBox').innerHTML=''; runAuto() }
$('pilot').onclick=()=>auto?takeOver():resume();
['phA','phB'].forEach(id=>$(id).addEventListener('pointerdown',()=>{ if(auto) takeOver() }));
$('askIn').addEventListener('focus',()=>{ if(auto) takeOver() });

$('chatForm').addEventListener('submit',async e=>{ e.preventDefault(); const t=$('chatIn').value.trim(); if(!t||auto) return; $('chatIn').value=''; bub('u',t); convo.push({role:'user',content:t}); await capP;
  const w=bub('m','…'); let out=null; const nU=convo.filter(c=>c.role==='user').length;
  if(sample){ try{ const memNote=mem&&mem.first?` Earlier they told you: "${String(mem.first).slice(0,300)}".`:''; const r=await sample(`You are Maybelle, an AI oral historian interviewing a person about a moment they were present for.${memNote} Conversation:\n${convo.map(c=>(c.role==='user'?'THEM: ':'YOU: ')+c.content).join('\n')}\n\nReply ONLY with JSON: {"reply": at most two short plain sentences: show you heard one specific thing, then ask ONE plain question${nU>=2?'; ask who else was there':''}, "people": [people they named as there], "moment": a 4-6 word name for the moment}. Never add a fact they did not say.`,{modelTier:'quick',cache:false}); const m=String(r.text||'').match(/\{[\s\S]*\}/); out=JSON.parse(m?m[0]:'{}') }catch(_){ out=null } }
  if(!out){ const names=[...new Set(t.match(/\b[A-Z][a-z]+(?:\s[A-Z][a-z]+)+/g)||[])]; out={reply:['What did you see that nobody else could have?','Who else was there?','What would they remember that you don’t?'][Math.min(nU-1,2)],people:names} }
  w.textContent=out.reply||'Who else was there?'; speak(out.reply); convo.push({role:'assistant',content:out.reply||''}); add('stories',1); grow(out.moment?String(out.moment).slice(0,26):'your story');
  (out.people||[]).slice(0,2).forEach(p=>{ add('people',1); grow(String(p).slice(0,24)); bub('m',`I can pair you with ${p} to talk about it, once I check they’re living and reachable.`) });
  if(!mem) mem={first:t}; try{localStorage.setItem(MEMKEY,JSON.stringify(mem))}catch(_){} memLine() });

$('askForm').addEventListener('submit',async e=>{ e.preventDefault(); const q=$('askIn').value.trim(); if(!q) return; if(auto) takeOver(); await capP;
  const hit=find(q)[0]; const box=$('answerBox');
  if(!hit){ box.innerHTML=`<div class="answer"><div class="k"><span>Maybelle</span><button type="button" onclick="this.closest('.answer').remove()">close</button></div>“${esc(q)}” isn’t in the Living Memory yet. That makes it a lead: I’d look for the people who were there.</div>`; return }
  setFocus(hit.id); const ls=(adj.get(hit.id)||[]).slice(0,6).map(e=>`${label(e.f)} ${HUMAN_VERB(e.v)} ${label(e.t)}`); const gaps=(hit.g||[]).map(g=>FLAGS[g]).filter(Boolean);
  let say=`${hit.l} has ${deg(hit.id)} lines in the Living Memory${gaps.length?', and the record '+gaps[0]:''}.`;
  box.innerHTML=`<div class="answer"><div class="k"><span>Maybelle · ${esc(hit.l)}</span><button type="button" onclick="this.closest('.answer').remove()">close</button></div><span id="say">${esc(say)}</span></div>`;
  if(sample){ try{ const r=await sample(`You are Maybelle, an AI oral historian. In two or three short plain sentences, using ONLY these facts, say what the Living Memory holds about ${hit.l}, where it is thin, and which two people you would pair to talk about it. Never add a fact; never claim anyone is living. FACTS: lines=${deg(hit.id)}; gaps=${JSON.stringify(gaps)}; sample lines=${JSON.stringify(ls)}`,{modelTier:'default',cache:false}); if(r&&r.text){ say=r.text.trim(); const s=$('say'); if(s) s.textContent=say } }catch(_){} }
  speak(say) });

runAuto();
})();
</script>
